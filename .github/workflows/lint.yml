name: Python linting

on:
  push:
    branches:
      - '*'
  pull_request:
    types: [ opened, synchronize ]

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint with Ruff
        uses: chartboost/ruff-action@v1
        with:
          version: 0.16.7

  requirements-in-sync:
    # application/requirements*.txt are exported from uv.lock; fail when a
    # change to pyproject.toml or uv.lock was not re-exported.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Re-export and diff
        run: |
          uv lock --check
          bash scripts/export_requirements.sh
          git diff --exit-code -- docsgpt/requirements.txt docsgpt/requirements-docling.txt docsgpt/requirements-milvus.txt
